name: HTTPS prüfen

on:
  workflow_dispatch:
    inputs:
      erzwingen:
        description: "Enforce HTTPS wo möglich einschalten"
        type: boolean
        default: false
      zertifikat:
        description: "Zertifikat neu anfordern für diese Repos (z. B. sebnb nobnb)"
        required: false
        default: ""

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prüfen
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/https_check.py ${{ inputs.erzwingen && '--erzwingen' || '' }} ${{ inputs.zertifikat }} | tee -a "$GITHUB_STEP_SUMMARY"
